INVARIANT PoolShape
INVARIANT WaitShape
INVARIANT IdleFresh
INVARIANT ShutdownClean
PROPERTY AcquireDiscipline
PROPERTY DownStaysDown
PROPERTY InvalidReleaseErrors
PROPERTY TakeServesHead
PROPERTY WaiterResolves
